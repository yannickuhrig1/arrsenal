[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arrsenal"
version = "0.1.0"
description = "Deploie ET cable automatiquement une stack media *arr complete"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "ruff>=0.5"]

[project.scripts]
arrsenal = "arrsenal.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/arrsenal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 : passer typer.Option en valeur par defaut EST l'idiome officiel de Typer.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
