<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="PlugArr">
  <title>PlugArr</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F79B45"/>
      <stop offset="52%" stop-color="#E4638A"/>
      <stop offset="100%" stop-color="#8B36C9"/>
    </linearGradient>
  </defs>

  <!-- Le A. Deux jambages et une barre : trace en une seule forme pour rester
       net a 16 px, la taille de l'onglet et de la barre des taches. -->
  <path fill="url(#g)" d="
    M128 30 h26 l62 172 h-44 l-13-38 h-19 l-11-32 h19 L128 92 100 202 H56 Z"/>

  <!-- Le cable : une prise a chaque bout, deux fleches qui se croisent. C'est
       la promesse du produit — il ne pose pas des services, il les RELIE. -->
  <g fill="none" stroke="url(#g)" stroke-width="13" stroke-linecap="round">
    <path d="M74 178 C 104 150, 146 150, 172 122"/>
    <path d="M182 152 C 152 180, 110 180, 84 208"/>
  </g>
  <g fill="url(#g)">
    <path d="M172 122 l30 -6 -12 26 z"/>
    <path d="M84 208 l-30 6 12 -26 z"/>
  </g>
  <g stroke="url(#g)" stroke-width="9" stroke-linecap="round">
    <path d="M196 100 l10 -14"/>
    <path d="M210 112 l12 -12"/>
    <path d="M60 230 l-10 14"/>
    <path d="M46 218 l-12 12"/>
  </g>
</svg>
